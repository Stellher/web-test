<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f9fe" />
<meta name="description" content="Sparkle 在线下载与导航 · 用更简单的方式发现好用的应用与工具。" />
<title>Sparkle — 简单发现更多</title>
<link rel="icon" type="image/svg+xml" href="assets/sparkle.svg" />
<style>
:root{color-scheme:light;--ink:#1a2335;--soft:#677186;--line:#e8ebf1;--blue:#466fe7;--base:#f7f9fe;--page:1160px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--base);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8db2ff;outline-offset:4px}.container{width:min(calc(100% - 56px),var(--page));margin:auto}
/* One quiet navigation row; only the active controls carry glass. */
header{height:88px;display:flex;align-items:center;position:relative;z-index:10}.navbar{display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:inline-flex;align-items:center;gap:11px;font-size:22px;font-weight:750;letter-spacing:-.055em}.brand img{width:33px;height:33px}.links{display:flex;align-items:center;gap:37px;margin-left:38px}.links a{font-size:14px;color:#687387;font-weight:560;transition:color .18s}.links a:hover,.links a.active{color:#182236}.top-action{display:inline-flex;align-items:center;justify-content:center;padding:11px 19px;border:1px solid #e1e7f0;border-radius:999px;background:#ffffffb5;color:#304057;font-size:13px;font-weight:650;box-shadow:0 2px 10px #14274207;white-space:nowrap}.top-action:hover{background:white}
main{position:relative}main:before{content:"";position:absolute;pointer-events:none;left:50%;top:92px;transform:translateX(-50%);width:min(100%,940px);height:510px;background:radial-gradient(ellipse 52% 50% at 50% 32%,#d8e7ff91,transparent 82%);z-index:-1}.hero{text-align:center;padding-top:85px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.15em;color:#75859d;display:flex;align-items:center;justify-content:center;gap:12px}.eyebrow:before{content:"";width:7px;height:7px;background:#6796f5;border-radius:50%;box-shadow:0 0 0 4px #dbe9ff}.hero h1{font-weight:720;font-size:clamp(43px,6.5vw,79px);line-height:1.2;letter-spacing:-.075em;margin:23px 0 20px}.hero h1 em{font-style:normal;color:#5b76d4}.hero p{font-size:16px;line-height:1.95;color:#768194;margin:0}.hero-actions{display:flex;align-items:center;justify-content:center;gap:20px;margin:25px 0 0}.hero-actions a{font-size:13px;font-weight:650;color:#536178}.hero-actions a:hover{color:var(--blue)}
/* Single visible liquid lens over a bright, static field. */
.search-scene{margin:53px auto 0;max-width:790px;min-height:195px;display:grid;place-items:center;isolation:isolate;position:relative;overflow:visible}.ambient{position:absolute;inset:7px 5px 5px;border-radius:42px;background:linear-gradient(118deg,#dfeaff 0%,#dae0ff 27%,#b4d9f6 51%,#dcd5ff 73%,#e8f1ff 100%);overflow:hidden}.ambient:before{content:"";position:absolute;width:140%;height:105px;left:-15%;top:47px;transform:rotate(-12deg);background:linear-gradient(90deg,transparent 5%,#9caff480 23%,#ffffffd6 49%,#8bbcf49e 70%,transparent 90%);border-radius:55%;filter:blur(18px)}.ambient:after{content:"";position:absolute;left:11%;right:11%;top:37px;bottom:26px;border:1px solid #ffffff75;border-radius:50%;transform:rotate(-10deg)}.ambient-stripe{position:absolute;width:135%;height:12px;left:-12%;top:101px;transform:rotate(-12deg);background:linear-gradient(90deg,transparent,#7198df85,#ffffffb8,#8a75ec8c,transparent);filter:blur(2px);border-radius:999px}.ambient-stripe.two{height:3px;top:121px;opacity:.7;background:#fff;filter:none}
.search-glass{position:relative;z-index:2;width:min(660px,calc(100% - 66px));height:77px;border-radius:26px;display:flex;align-items:center;padding:0 19px;gap:14px;background:linear-gradient(148deg,#ffffff80 0%,#ffffff51 43%,#f5f8ff78 100%);border:1.4px solid #ffffffdd;box-shadow:0 17px 35px #5973a72b,0 2px 5px #ffffffb8 inset,0 -3px 9px #8a9fd233 inset,1px 1px 0 #fff;backdrop-filter:blur(15px) saturate(180%);-webkit-backdrop-filter:blur(15px) saturate(180%)}.search-glass:before{content:"";position:absolute;inset:3px;border-radius:23px;pointer-events:none;border:1px solid #ffffff65;box-shadow:0 1px 2px #ffffffa8 inset}.search-glass:after{content:"";position:absolute;left:8%;right:8%;top:0;height:2px;border-radius:100%;background:linear-gradient(90deg,transparent,#fff,transparent);pointer-events:none}.search-glass .glass-content{position:relative;z-index:3;display:flex;align-items:center;width:100%;height:100%;gap:14px}.search-icon{flex:none;width:21px;height:21px;stroke:#526381;stroke-width:1.9;fill:none;stroke-linecap:round}.search-glass input{flex:1;min-width:0;outline:none;border:0;color:#253550;background:transparent;font-size:16px;font-weight:500}.search-glass input::placeholder{color:#6d7890}.shortcut{flex:none;font-size:11px;color:#6d7a96;border:1px solid #ffffffc9;border-radius:8px;padding:6px 9px;background:#ffffff46}.search-submit{width:39px;height:39px;border:1px solid #fefeffdc;border-radius:13px;background:linear-gradient(140deg,#7297ed,#5c7edd);color:white;display:grid;place-items:center;font-size:21px;line-height:1;box-shadow:0 4px 10px #4b6cbd37}.search-submit:hover{filter:brightness(1.05)}.scene-caption{position:absolute;bottom:10px;left:0;right:0;font-size:11px;letter-spacing:.07em;color:#8d98ac;z-index:2;pointer-events:none}
/* Utility content is plain, solid and inexpensive to render. */
.quick{max-width:940px;margin:66px auto 0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:21px;text-align:left}.section-head h2{font-size:17px;letter-spacing:-.03em;font-weight:730;margin:0}.section-head span{font-size:12px;color:#919baa}.entry-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.entry{position:relative;text-align:left;min-height:142px;padding:24px 21px 19px;border:1px solid #e9edf4;background:#fff;border-radius:20px;transition:transform .18s,border-color .18s,box-shadow .18s;display:flex;flex-direction:column;align-items:flex-start}.entry:hover{transform:translateY(-3px);border-color:#cbdaf9;box-shadow:0 12px 30px #263f6610}.entry-icon{width:37px;height:37px;border-radius:12px;display:grid;place-items:center;margin-bottom:18px;font-size:20px}.entry:nth-child(1) .entry-icon{color:#5c76ce;background:#ebf0ff}.entry:nth-child(2) .entry-icon{color:#41968d;background:#e8f5f3}.entry:nth-child(3) .entry-icon{color:#8f6cb4;background:#f1ebf7}.entry:nth-child(4) .entry-icon{color:#b88a4a;background:#fff3e5}.entry-name{font-size:15px;font-weight:690;line-height:1.2}.entry-note{font-size:11px;color:#96a0ae;margin-top:6px}.entry-arrow{position:absolute;right:18px;top:22px;color:#abb4c2;font-size:14px}
footer{border-top:1px solid #e9edf3;margin-top:95px}.foot{display:flex;justify-content:space-between;gap:16px;padding:26px 0 35px;font-size:12px;color:#98a2b2}.foot a:hover{color:var(--blue)}
/* Search results are opt-in, so the first paint stays compact. */
.results{position:absolute;top:calc(50% + 44px);left:50%;transform:translateX(-50%);width:min(660px,calc(100% - 66px));z-index:9;max-height:350px;overflow:auto;padding:8px;border:1px solid #e6ebf5;border-radius:19px;background:#fffffff5;box-shadow:0 22px 60px #3a50712c;text-align:left}.results[hidden]{display:none}.result-group{padding:9px 12px 6px;font-size:11px;color:#94a0b2;letter-spacing:.06em}.result{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:10px}.result:hover,.result:focus-visible{background:#f0f5ff}.result-title{font-weight:670;font-size:13px}.result-sub{font-size:11px;color:#8792a3;margin-top:4px}.result-end{font-size:11px;color:#8494ad}.empty{padding:16px;text-align:center;font-size:13px;color:#718197}.status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:700px){.container{width:calc(100% - 36px)}header{height:74px}.brand{font-size:21px}.brand img{width:29px;height:29px}.links{display:none}.top-action{padding:10px 15px;font-size:12px}.hero{padding-top:67px}.eyebrow{font-size:10px}.hero h1{font-size:clamp(40px,9vw,60px);margin:25px 0 17px;letter-spacing:-.065em}.hero p{font-size:13px;line-height:1.9;padding:0 9px}.search-scene{margin-top:36px;min-height:166px}.ambient{inset:6px 0 4px;border-radius:30px}.ambient:before{filter:blur(12px)}.search-glass{width:calc(100% - 28px);height:65px;border-radius:21px;padding:0 13px}.search-glass:before{border-radius:18px}.search-glass input{font-size:14px}.search-glass .glass-content{gap:9px}.shortcut{display:none}.search-submit{height:36px;width:36px;border-radius:11px}.results{width:calc(100% - 28px);top:calc(50% + 37px)}.quick{margin-top:56px}.entry-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.entry{padding:18px 16px;min-height:133px;border-radius:16px}.entry-icon{margin-bottom:16px}.entry-name{font-size:14px}.section-head span{font-size:11px}.entry-arrow{top:19px;right:16px}footer{margin-top:70px}.foot{padding:24px 0 29px}.foot span:last-child{display:none}}
@media(max-width:360px){.search-glass{width:calc(100% - 18px)}.search-glass input{font-size:12px}.hero h1{font-size:38px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.entry,.links a{transition:none}}
</style>
</head>
<body>
<header>
  <div class="container navbar">
    <a class="brand" href="#top" aria-label="Sparkle 首页"><img src="assets/sparkle.svg" alt=""/> Sparkle</a>
    <nav class="links" aria-label="主要导航"><a class="active" href="#top">首页</a><a href="#quick">资源导航</a><a href="#about">关于</a></nav>
    <a class="top-action" href="https://stobox.dpdns.org/" target="_blank" rel="noopener noreferrer">访问原站 <span aria-hidden="true">↗</span></a>
  </div>
</header>
<main id="top">
  <section class="hero container" aria-labelledby="heroTitle">
    <div class="eyebrow">SPARKLE · 在线下载与导航</div>
    <h1 id="heroTitle">发现好工具，<br><em>就这么简单。</em></h1>
    <p>精选实用应用与在线工具。<br>少一些繁杂，多一点高效。</p>
    <div class="search-scene" id="scene">
      <div class="ambient" aria-hidden="true"><span class="ambient-stripe"></span><span class="ambient-stripe two"></span></div>
      <form class="search-glass liquidGL" id="searchForm" role="search" autocomplete="off">
        <div class="glass-content">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.7" cy="10.7" r="7.1"/><path d="M16.2 16.2 21 21"/></svg>
          <input id="query" type="search" placeholder="搜索应用、工具或资源..." aria-label="搜索应用、工具或资源" aria-expanded="false" aria-controls="results" />
          <span class="shortcut" aria-hidden="true">⌘ K</span>
          <button class="search-submit" type="submit" aria-label="搜索">↗</button>
        </div>
      </form>
      <div class="results" id="results" role="listbox" aria-label="搜索结果" hidden></div>
      <div class="scene-caption">A BETTER WAY TO DISCOVER</div>
    </div>
  </section>
  <section id="quick" class="quick container" aria-labelledby="quickHeading">
    <div class="section-head"><h2 id="quickHeading">快速探索</h2><span>选择你感兴趣的方向</span></div>
    <div class="entry-grid">
      <button class="entry" type="button" data-cat="应用推荐"><span class="entry-arrow">↗</span><span class="entry-icon">▣</span><span class="entry-name">应用推荐</span><span class="entry-note">发现好用的软件</span></button>
      <button class="entry" type="button" data-cat="效率工具"><span class="entry-arrow">↗</span><span class="entry-icon">⌁</span><span class="entry-name">效率工具</span><span class="entry-note">让工作更轻松</span></button>
      <button class="entry" type="button" data-cat="设计创作"><span class="entry-arrow">↗</span><span class="entry-icon">✧</span><span class="entry-name">设计创作</span><span class="entry-note">灵感随手可得</span></button>
      <button class="entry" type="button" data-cat="开发资源"><span class="entry-arrow">↗</span><span class="entry-icon">⌘</span><span class="entry-name">开发资源</span><span class="entry-note">构建更多可能</span></button>
    </div>
  </section>
</main>
<footer id="about"><div class="container foot"><span>© <span id="year">2026</span> Sparkle · 让数字生活更简单</span><span><a href="https://stobox.dpdns.org/" target="_blank" rel="noopener noreferrer">stobox.dpdns.org ↗</a></span></div></footer>
<div class="status" id="announcement" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const catalog=[
  {name:'VLC',cat:'应用推荐',desc:'开源多媒体播放器',url:'https://www.videolan.org/vlc/'},
  {name:'Obsidian',cat:'应用推荐',desc:'本地优先的知识笔记',url:'https://obsidian.md/'},
  {name:'Notion',cat:'效率工具',desc:'文档与项目协作',url:'https://www.notion.so/'},
  {name:'Raycast',cat:'效率工具',desc:'高效启动与自动化',url:'https://www.raycast.com/'},
  {name:'Figma',cat:'设计创作',desc:'多人在线界面设计',url:'https://www.figma.com/'},
  {name:'Blender',cat:'设计创作',desc:'开源三维创作工具',url:'https://www.blender.org/'},
  {name:'GitHub',cat:'开发资源',desc:'开源与代码协作平台',url:'https://github.com/'},
  {name:'Visual Studio Code',cat:'开发资源',desc:'跨平台代码编辑器',url:'https://code.visualstudio.com/'}
];
const $=s=>document.querySelector(s),input=$('#query'),results=$('#results'),form=$('#searchForm'),notify=$('#announcement');
function close(){results.hidden=true;input.setAttribute('aria-expanded','false')}
function show(items,title){results.replaceChildren();const label=document.createElement('div');label.className='result-group';label.textContent=title;results.append(label);if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent='没有找到相关项目，可以换个关键词';results.append(e)}else{items.slice(0,8).forEach(item=>{const a=document.createElement('a');a.className='result';a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('role','option');a.innerHTML='<span><span class="result-title"></span><span class="result-sub"></span></span><span class="result-end">↗</span>';a.querySelector('.result-title').textContent=item.name;a.querySelector('.result-sub').textContent=item.desc;results.append(a)})}results.hidden=false;input.setAttribute('aria-expanded','true')}
function search(){const q=input.value.trim().toLocaleLowerCase();show(catalog.filter(x=>(x.name+' '+x.desc+' '+x.cat).toLocaleLowerCase().includes(q)),q?'搜索结果':'精选工具 · 演示数据')}
input.addEventListener('input',search);input.addEventListener('focus',search);
form.addEventListener('submit',e=>{e.preventDefault();search();const first=results.querySelector('a');if(first&&input.value.trim())first.focus()});
document.querySelectorAll('[data-cat]').forEach(btn=>btn.addEventListener('click',()=>{const cat=btn.dataset.cat;input.value='';show(catalog.filter(x=>x.cat===cat),cat+' · 示例资源');document.getElementById('scene').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'});notify.textContent='已打开'+cat+'资源列表'}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();input.focus()}});
document.addEventListener('pointerdown',e=>{if(!form.contains(e.target)&&!results.contains(e.target)&&!e.target.closest('[data-cat]'))close()});
$('#year').textContent=String(new Date().getFullYear());
/* Only on faster desktop devices and only after first paint; mobile remains CSS-only. */
const fine=matchMedia('(pointer:fine) and (min-width:900px)').matches,reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;const cores=navigator.hardwareConcurrency||2;const memory=navigator.deviceMemory||4;
if(fine&&!reduced&&cores>=4&&memory>=4){const start=()=>{const s=document.createElement('script');s.src='assets/liquidGL.js';s.async=true;s.onload=()=>{try{if(typeof liquidGL==='function')window.__sparkleLens=liquidGL({target:'.liquidGL',snapshot:'body',resolution:.65,refraction:.018,bevelDepth:.13,bevelWidth:.17,aberration:.08,frost:1.3,shadow:false,specular:false,tilt:false,reveal:'none'})}catch(err){console.warn('Liquid lens fallback:',err)}};s.onerror=()=>console.info('Using CSS glass fallback');document.body.append(s)};if('requestIdleCallback'in window)requestIdleCallback(start,{timeout:2200});else addEventListener('load',start,{once:true})}
})();
</script>
</body>
</html>
